# Netlify settings: the storefront is static files in web/; the build step generates sitemap.xml, robots.txt and
# crawlable product/page files from your Supabase data (set SITE_URL in Netlify env vars, or in Admin → SEO).
[build]
  command = "node scripts/build-seo.mjs"
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Icons and the manifest rarely change; everything else revalidates so new deploys show up straight away.
[[headers]]
  for = "/icon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
